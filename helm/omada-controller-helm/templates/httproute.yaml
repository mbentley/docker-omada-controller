{{- if and .Values.gatewayApi.enabled .Values.gatewayApi.httpRoute.enabled -}}
{{- include "omada-controller.gatewayApiCapabilities" . -}}
{{- $fullName := include "omada-controller.fullname" . -}}
{{- $httpRoute := .Values.gatewayApi.httpRoute -}}
{{- $parentRefs := $httpRoute.parentRefs -}}
{{- if and (not $parentRefs) .Values.gatewayApi.gateway.enabled -}}
{{- $parentRefs = list (dict "name" (include "omada-controller.gatewayName" .)) -}}
{{- end -}}
{{- range $name, $route := dict "management" $httpRoute.management "portal" $httpRoute.portal }}
{{- if and $route $route.enabled }}
{{- $refs := $route.parentRefs | default $parentRefs }}
{{- if not $refs }}
{{- fail (printf "gatewayApi.httpRoute.%s is enabled but no Gateway was configured. Set gatewayApi.httpRoute.parentRefs or enable gatewayApi.gateway." $name) }}
{{- end }}
{{- $defaultPort := $.Values.config.ports.manageHttps }}
{{- if eq $name "portal" }}
{{- $defaultPort = $.Values.config.ports.portalHttps }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" $fullName $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "omada-controller.labels" $ | nindent 4 }}
    {{- with $httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $refs | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - backendRefs:
    - name: {{ $fullName }}
      port: {{ $route.port | default $defaultPort }}
    {{- with $route.matches }}
    matches:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $route.filters }}
    filters:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $route.timeouts }}
    timeouts:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
